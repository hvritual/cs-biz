# Non-production resources only. Application OIDC integration is provider-neutral.
services:
  mysql:
    image: mysql:8.4.11@sha256:24989179f58856db763f418010c1169fecc944e3ec1ea7e921572d83eb070f70
    environment:
      MYSQL_ROOT_PASSWORD: ${CS_MYSQL_ROOT_PASSWORD:?initialize private runtime state}
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: ${CS_KEYCLOAK_DB_PASSWORD:?initialize private runtime state}
    command: [--character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci]
    ports: ["127.0.0.1:${CS_MYSQL_PORT:?}:3306"]
    volumes: [mysql-data:/var/lib/mysql]
    healthcheck:
      test: [CMD, mysqladmin, ping, --silent]
      interval: 3s
      timeout: 3s
      retries: 60
    mem_limit: 1g
  oidc:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:79c623a22abacf3fe6c00a5fb30f5b7843d717b234033b80995891c06116d244
    command: [start-dev, --import-realm]
    environment:
      KC_DB: mysql
      KC_DB_URL: jdbc:mysql://mysql:3306/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${CS_KEYCLOAK_DB_PASSWORD:?initialize private runtime state}
      KC_BOOTSTRAP_ADMIN_USERNAME: resource-admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${CS_OIDC_ADMIN_PASSWORD:?initialize private runtime state}
      KC_HOSTNAME: http://127.0.0.1:${CS_OIDC_PORT:?}
      KC_HTTP_ENABLED: 'true'
      KC_HEALTH_ENABLED: 'true'
      KC_LOG_LEVEL: warn
    depends_on:
      mysql: {condition: service_healthy}
    ports: ["127.0.0.1:${CS_OIDC_PORT:?}:8080"]
    volumes: ["./realm.json:/opt/keycloak/data/import/cs-biz-nonprod-realm.json:ro"]
    mem_limit: 1g
volumes:
  mysql-data: {}
