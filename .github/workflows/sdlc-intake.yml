name: SDLC Issue Intake

on:
  issues:
    types: [opened, edited, reopened]

permissions:
  contents: read

concurrency:
  group: sdlc-intake-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  intake:
    if: startsWith(github.event.issue.title, '[Intent]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Trusted default-branch code only; Issue contents are data, never shell.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Validate and prepare handoff
        run: python3 doc/ci/sdlc_issue_intake.py --event "$GITHUB_EVENT_PATH" --repository "$GITHUB_REPOSITORY" --output intake.json
      - name: Save non-authorizing handoff
        uses: actions/upload-artifact@v4
        with:
          name: sdlc-intake-${{ github.event.issue.number }}-${{ github.run_id }}
          path: intake.json
          retention-days: 7
