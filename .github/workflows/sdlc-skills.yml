name: SDLC Skills Contract

on:
  push:
    paths:
      - ".agents/skills/**"
      - "doc/ci/check_goal_resume.py"
      - "doc/ci/test_goal_resume.py"
      - "doc/ci/sdlc_issue_intake.py"
      - "doc/ci/test_sdlc_issue_intake.py"
      - ".github/workflows/sdlc-intake.yml"
      - ".github/ISSUE_TEMPLATE/sdlc-intent.yml"
      - "doc/workflow/**"
      - "doc/ci/check_*workflow.py"
      - "doc/ci/check_revision_v04.py"
      - "doc/ci/check_intent_v02.py"
      - "doc/ci/check_build_v04.py"
      - "doc/ci/test_*workflow.py"
      - "doc/ci/test_revision_v04.py"
      - "doc/ci/test_intent_v02.py"
      - "doc/ci/test_build_v04.py"
      - ".github/workflows/sdlc-skills.yml"
      - ".github/workflows/frontend-full.yml"
      - ".github/workflows/frontend.yml"
      - "frontend/ci/check-delivery-policy.mjs"
      - "doc/ci/manual_full_dispatch.py"
      - "doc/ci/test_manual_full_dispatch.py"
      - "doc/ci/check_human_full_policy.py"
      - "doc/ci/test_human_full_policy.py"
      - "doc/ci/NO-STALL-GATES.md"
      - "frontend/ci/README.md"
      - "AGENTS.md"
  pull_request:
    paths:
      - ".agents/skills/**"
      - "doc/ci/check_goal_resume.py"
      - "doc/ci/test_goal_resume.py"
      - "doc/ci/sdlc_issue_intake.py"
      - "doc/ci/test_sdlc_issue_intake.py"
      - ".github/workflows/sdlc-intake.yml"
      - ".github/ISSUE_TEMPLATE/sdlc-intent.yml"
      - "doc/workflow/**"
      - "doc/ci/check_*workflow.py"
      - "doc/ci/check_revision_v04.py"
      - "doc/ci/check_intent_v02.py"
      - "doc/ci/check_build_v04.py"
      - "doc/ci/test_*workflow.py"
      - "doc/ci/test_revision_v04.py"
      - "doc/ci/test_intent_v02.py"
      - "doc/ci/test_build_v04.py"
      - ".github/workflows/sdlc-skills.yml"
      - ".github/workflows/frontend-full.yml"
      - ".github/workflows/frontend.yml"
      - "frontend/ci/check-delivery-policy.mjs"
      - "doc/ci/manual_full_dispatch.py"
      - "doc/ci/test_manual_full_dispatch.py"
      - "doc/ci/check_human_full_policy.py"
      - "doc/ci/test_human_full_policy.py"
      - "doc/ci/NO-STALL-GATES.md"
      - "frontend/ci/README.md"
      - "AGENTS.md"

permissions:
  contents: read

jobs:
  skill-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repository structure
        run: python3 doc/ci/check_repository.py
      - name: Skill structure
        run: |
          python3 doc/ci/check_build_workflow.py
          python3 doc/ci/check_sdlc_workflow.py --mode structure
      - name: Negative fixtures
        run: |
          python3 -m unittest discover -s doc/ci -p 'test_*workflow.py' -v
          python3 -m unittest discover -s doc/ci -p 'test_revision_v04.py' -v
          python3 -m unittest discover -s doc/ci -p 'test_intent_v02.py' -v
          python3 -m unittest discover -s doc/ci -p 'test_build_v04.py' -v
      - name: Manual Full CI policy and negative fixtures
        run: |
          python3 -m unittest discover -s doc/ci -p 'test_manual_full_dispatch.py' -v
          python3 doc/ci/check_human_full_policy.py
          python3 -m unittest discover -s doc/ci -p 'test_human_full_policy.py' -v
          node frontend/ci/check-delivery-policy.mjs
      - name: Goal resume and Issue intake negative cases
        run: |
          python3 -m unittest discover -s doc/ci -p 'test_goal_resume.py' -v
          python3 -m unittest discover -s doc/ci -p 'test_sdlc_issue_intake.py' -v
