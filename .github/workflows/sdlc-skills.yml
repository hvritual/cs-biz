name: SDLC Skills Contract

on:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  skill-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Repository structure
        run: python3 doc/ci/check_repository.py
      - name: Skill structure
        run: |
          python3 doc/ci/check_build_workflow.py
          python3 doc/ci/check_sdlc_workflow.py --mode structure
      - name: Negative fixtures
        run: |
          python3 -m unittest discover -s doc/ci -p 'test_*workflow.py' -v
      - name: Manual Full CI policy and negative fixtures
        run: |
          python3 -m unittest discover -s doc/ci -p 'test_manual_full_dispatch.py' -v
          python3 doc/ci/check_human_full_policy.py
          python3 -m unittest discover -s doc/ci -p 'test_human_full_policy.py' -v
          node frontend/ci/check-delivery-policy.mjs
