name: Frontend Fast Gate

# Internal branch pushes run exactly one cheap gate. Internal PR hooks are
# intentionally skipped because they point at the same head commit.
on:
  push:
    paths:
      - 'frontend/**'
      - 'doc/design/**'
      - 'doc/ci/**'
      - 'doc/templates/**'
      - 'AGENTS.md'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/frontend-full.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - 'doc/design/**'
      - 'doc/ci/**'
      - 'doc/templates/**'
      - 'AGENTS.md'
      - '.github/workflows/frontend.yml'
      - '.github/workflows/frontend-full.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-fast-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  frontend-fast:
    # PRs from this same repo are already covered by the push workflow.
    # Forked PRs still receive fast validation.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.19.0'
          package-manager-cache: false
      - name: Activate pinned package manager
        working-directory: frontend
        run: |
          corepack enable
          corepack install
      - name: Install locked dependencies
        working-directory: frontend
        run: corepack pnpm install --frozen-lockfile
      - name: Manual Full dispatch regression fixtures
        run: |
          python3 -m unittest discover -s doc/ci -p 'test_manual_full_dispatch.py' -v
          python3 doc/ci/check_human_full_policy.py
          python3 -m unittest discover -s doc/ci -p 'test_human_full_policy.py' -v
      - name: Fast type, lint, copy, token, gate-policy and unit checks
        working-directory: frontend
        run: corepack pnpm check:fast
