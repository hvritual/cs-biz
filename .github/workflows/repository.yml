name: Repository structure

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-structure:
    # Internal PRs are already checked through push; forks require PR checks.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6; observed 2026-10-12
        with:
          persist-credentials: false
      - name: Check repository structure and documentation
        run: python3 doc/ci/check_repository.py
